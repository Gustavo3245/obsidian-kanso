name: Bug report
description: Something looks wrong or doesn't work
labels: [bug]
body:
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      placeholder: e.g. 1.6.7
    validations:
      required: true
  - type: input
    id: variant
    attributes:
      label: Theme variant
      placeholder: Zen, Ink, Mist, Void, or Pearl
    validations:
      required: true
  - type: dropdown
    id: color-scheme
    attributes:
      label: Light or dark mode
      options:
        - Light
        - Dark
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 14, Windows 11, Android 14
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: What you did, and what you expected to happen instead
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: A screenshot of the issue makes it much easier to track down
